# Runs the exit-certificate tool E2E test.
# Triggers only when a PR touches files under aggkit/tools/exit_certificate/** (or the
# test harness / this workflow itself). The test spins up a Kurtosis CDK
# network, prepares a settled certificate and runs the exit_certificate tool.
name: Test E2E exit-certificate tool

on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect aggkit changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      aggkit: ${{ steps.filter.outputs.aggkit }}
    steps:
      # paths-filter needs a checkout for push events; on pull_request it uses the API.
      # Other events (schedule, workflow_dispatch) are not supported by the filter and always run.
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v5

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            aggkit:
              - 'aggkit/tools/exit_certificate/**'
              - 'aggkit/tools/exit_certificate_claimer/**'
              - 'aggkit/test/e2e-exit_certificate/**'
              - 'aggkit/Dockerfile'
              - '.github/workflows/aggkit-test-e2e-exit-certificate-tool.yml'

  test-e2e-exit-certificate:
    name: Exit-certificate tool E2E
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.aggkit == 'true'
    runs-on: amd-runner-2204
    defaults:
      run:
        working-directory: aggkit
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.9

      - name: Install Foundry (cast/forge)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Install Kurtosis CLI
        run: |
          echo "deb [trusted=yes] https://apt.fury.io/kurtosis-tech/ /" \
            | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt update
          sudo apt install -y kurtosis-cli
          kurtosis analytics disable
          kurtosis version

      - name: Run exit-certificate E2E test
        env:
          VERBOSE: "1"
          # Exercise the claimer through its docker-compose deployment (the same
          # artifact users deploy) instead of a host binary.
          CLAIMER_MODE: docker
        run: ./test/e2e-exit_certificate/run_e2e_test.sh

      - name: Stop Kurtosis enclave
        if: always()
        run: ./test/e2e-exit_certificate/10-run_network.sh stop || true

  ok:
    name: Test E2E exit-certificate tool ok
    needs: [changes, test-e2e-exit-certificate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
