name: Test Unit

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect aggkit changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      aggkit: ${{ steps.filter.outputs.aggkit }}
    steps:
      # paths-filter needs a checkout for push events; on pull_request it uses the API.
      # Other events (schedule, workflow_dispatch) are not supported by the filter and always run.
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v5

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            aggkit:
              - 'aggkit/**'
              - '.github/workflows/aggkit-test-unit.yml'

  test-unit:
    name: test-unit
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.aggkit == 'true'
    defaults:
      run:
        working-directory: aggkit
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.9]
        goarch: ["amd64"]
    runs-on: amd-runner-2204
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
        env:
          GOARCH: ${{ matrix.goarch }}

      - name: Test
        run: make test-unit

  ok:
    name: Test Unit ok
    needs: [changes, test-unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
