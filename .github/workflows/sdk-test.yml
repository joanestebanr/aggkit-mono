name: SDK Test cases

on:
  push:
    branches: [develop, main]
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-test.yml'
  # No `paths` filter on pull_request: a skipped workflow would leave required
  # checks pending forever. Path selection is done by the `changes` job instead.
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

defaults:
  run:
    working-directory: sdk

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      # paths-filter uses the API on pull_request; other events need a checkout.
      - name: Checkout code
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sdk:
              - 'sdk/**'
              - '.github/workflows/sdk-test.yml'

  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # bun.lock is the text lockfile format, which needs bun >= 1.2.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type checking
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Run format check
        run: bun run format:check

      - name: Run tests
        run: bun run test:run

      - name: Build project
        run: bun run build

  # Stable single check name for branch protection; passes when tests were
  # skipped because nothing under sdk/ changed.
  sdk-test-ok:
    name: sdk test ok
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        run: |
          if [[ "${{ needs.changes.result }}" == "failure" || "${{ needs.changes.result }}" == "cancelled" \
             || "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]]; then
            echo "SDK tests failed or were cancelled"
            exit 1
          fi
          echo "SDK tests ok (test result: ${{ needs.test.result }})"
